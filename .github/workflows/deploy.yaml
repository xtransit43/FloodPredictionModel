name: CI/CD Pipeline to GKE

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: "project-efb19ab5-6e5a-402c-81a"
  REGION: "us-central1"
  CLUSTER_NAME: "flood-cluster"
  IMAGE: "flood-dashboard"
  WORKLOAD_IDENTITY_PROVIDER: "projects/251024216913/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions-deployer@project-efb19ab5-6e5a-402c-81a.iam.gserviceaccount.com"

jobs:
  deploy:
    name: Build and Deploy to GKE
    runs-on: ubuntu-latest
    
    # Required permissions for OIDC token exchange
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Authenticate to Google Cloud using Workload Identity Federation (No keys needed!)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    # 2. Configure Docker to use Google Artifact Registry
    - name: Configure Docker Client
      run: |-
        gcloud --quiet auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    # 3. Build and Push Docker Image using Google Cloud Build
    - name: Build and Push Container
      run: |-
        IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/app-repo/${{ env.IMAGE }}:${{ github.sha }}"
        LATEST_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/app-repo/${{ env.IMAGE }}:latest"
        
        gcloud builds submit --tag "${{ '{' }}IMAGE_URL{{ '}' }}" .
        gcloud container images add-tag "${{ '{' }}IMAGE_URL{{ '}' }}" "${{ '{' }}LATEST_URL{{ '}' }}" --quiet

    # 4. Fetch GKE Cluster Credentials for kubectl
    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.REGION }}

    # 5. Apply Kubernetes Manifests and Roll Out New Version
    - name: Deploy to GKE
      run: |-
        # Dynamically inject the unique git commit SHA into your k8s-deployment.yaml
        sed -i 's|image: .*app-repo/flood-dashboard:.*|image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/app-repo/${{ env.IMAGE }}:${{ github.sha }}|g' k8s-deployment.yaml
        
        kubectl apply -f k8s-deployment.yaml
        kubectl rollout status deployment/flood-dashboard-deployment
